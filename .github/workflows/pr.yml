name: PR validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@1e60f620b9541d7c243d3c1eeda18facf4b3d8ab
        with:
          node-version: 24
          cache: npm
      - name: Locked dependency install without scripts
        run: npm ci --ignore-scripts
      - name: Validators
        run: npm run validate
      - name: Tests including synthetic installer and lifecycle fixtures
        run: npm test
      - name: Regenerate and require diff zero
        run: npm run generate:reports && npm run generate:sources && npm run lock && git diff --exit-code
      - name: Lock and package policy
        run: npm run validate:distribution && npm run validate:m8 && npm pack --dry-run --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json" && node tools/validate-m8-ci.mjs --package-report "$RUNNER_TEMP/npm-pack.json"
      - name: Secret and private-key scan
        run: node tools/scan-release-sensitive.mjs
      - name: Clean dual pack comparison
        run: mkdir -p "$RUNNER_TEMP/pack-a" "$RUNNER_TEMP/pack-b" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack-a" >/dev/null && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack-b" >/dev/null && cmp "$RUNNER_TEMP/pack-a/agentic-devops-framework-v3-3.0.0.tgz" "$RUNNER_TEMP/pack-b/agentic-devops-framework-v3-3.0.0.tgz"
