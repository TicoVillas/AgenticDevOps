$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:release-asset-inventory:3.0
$comment: schema-version-3.1.0
type: object
additionalProperties: false
required: [schema_version, release_id, algorithm, serialization, assets, serialized_sha256]
properties:
  schema_version: { const: 1 }
  release_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$' }
  algorithm: { const: SHA-256 }
  serialization: { const: 'LOWERCASE_HEX_TWO_SPACES_NAME_LF' }
  assets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, sha256, size]
      properties:
        name: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$))[^\\]+$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 0 }
  serialized_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
