$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:operation-tombstone:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, operation_id, operation_class, plan_sha256, journal_sha256, created_at, outcome, retention_class, removed_paths]
properties:
  schema_version: { const: 1 }
  operation_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
  operation_class: { enum: [UNINSTALL, DESTRUCTIVE_CLEANUP] }
  plan_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  journal_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  created_at: { type: string, format: date-time }
  outcome: { enum: [COMPLETED, PARTIAL, UNKNOWN, BLOCKED] }
  retention_class: { const: INDEFINITE }
  removed_paths:
    type: array
    uniqueItems: true
    items: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
  preserved_paths:
    type: array
    uniqueItems: true
    items: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
  reconciliation_status: { enum: [RECONCILED, UNRECONCILED] }
allOf:
  - if: { properties: { outcome: { enum: [PARTIAL, UNKNOWN] } } }
    then: { required: [reconciliation_status], properties: { reconciliation_status: { const: UNRECONCILED } } }
