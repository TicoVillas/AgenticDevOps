$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:release-signature:3.0
$comment: schema-version-3.1.0; detached Ed25519 signature envelope
type: object
additionalProperties: false
required: [schema_version, target, target_name, target_sha256, algorithm, key_id, fingerprint_sha256, encoding, signature]
properties:
  schema_version: { const: 1 }
  target: { enum: [MANIFEST, CHECKSUMS] }
  target_name: { type: string, pattern: '^(?:release-manifest-[A-Za-z0-9._-]+\.json|SHA256SUMS)$' }
  target_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  algorithm: { const: Ed25519 }
  key_id: { type: string, pattern: '^release-[a-z0-9][a-z0-9-]{2,63}$' }
  fingerprint_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  encoding: { const: base64 }
  signature: { type: string, pattern: '^[A-Za-z0-9+/]+={0,2}$', minLength: 4 }
