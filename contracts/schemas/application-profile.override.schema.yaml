$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:application-profile-override:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [scope, rationale, authorization_ref, authorized_at, expires_at, base_profile_hash, source_evidence]
properties:
  scope: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
  rationale: { type: string, minLength: 12 }
  authorization_ref: { type: string, minLength: 1 }
  authorized_at: { type: string, format: date-time }
  expires_at: { type: string, format: date-time }
  base_profile_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
  source_evidence: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
