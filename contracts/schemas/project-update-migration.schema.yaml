$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:project-update-migration:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, catalog_version, id, from_version, to_version, document_path, owned_fields, preconditions, implementation, rollback_implementation, reversible, fixtures]
properties:
  schema_version: { const: 1 }
  catalog_version: { type: integer, minimum: 1 }
  id: { type: string, pattern: '^project-[a-z0-9]+(?:-[a-z0-9]+)*$' }
  from_version: { type: integer, minimum: 1 }
  to_version: { type: integer, minimum: 1 }
  document_path: { const: .agentic/application-profile.yaml }
  owned_fields: { type: array, minItems: 1, uniqueItems: true, items: { type: string, pattern: '^[a-z_]+(?:\.[a-z_]+)*$' } }
  preconditions: { type: array, minItems: 1, uniqueItems: true, items: { type: string, minLength: 1 } }
  implementation: { type: string, pattern: '^tools/lib/project-update/[a-z0-9-]+\.mjs#[A-Za-z0-9]+$' }
  rollback_implementation: { type: string, pattern: '^tools/lib/project-update/[a-z0-9-]+\.mjs#[A-Za-z0-9]+$' }
  reversible: { const: true }
  fixtures: { type: array, minItems: 2, uniqueItems: true, items: { type: string, pattern: '^fixtures/(?!.*\.\.).+\.yaml$' } }
