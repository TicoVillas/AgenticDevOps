$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:release-compensating-control:3.0
$comment: schema-version-3.1.0; draft, review, recommendation, or defaults are never approval
type: object
additionalProperties: false
required: [schema_version, control_id, release_id, mechanism, approval_status, approval_authority, approved_at, evidence_sha256, residual_risks]
properties:
  schema_version: { const: 1 }
  control_id: { type: string, pattern: '^immutability-control-[A-Za-z0-9._-]{3,127}$' }
  release_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$' }
  mechanism: { type: string, minLength: 8, maxLength: 1024 }
  approval_status: { const: EXPLICITLY_APPROVED }
  approval_authority:
    type: object
    additionalProperties: false
    required: [role, authorization_reference, authorization_sha256]
    properties:
      role: { type: string, minLength: 1 }
      authorization_reference: { type: string, minLength: 1 }
      authorization_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  approved_at: { type: string, format: date-time }
  expires_at: { type: string, format: date-time }
  evidence_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  residual_risks:
    type: array
    items: { type: string, minLength: 1 }
