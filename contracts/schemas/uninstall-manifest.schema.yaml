$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:uninstall-manifest:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, installation_receipt_sha256, destination_root_id, managed_paths, preserve_unmanaged, restore_originals]
properties:
  schema_version: { const: 1 }
  installation_receipt_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  destination_root_id: { type: string, pattern: '^[A-Z][A-Z0-9_]*_ROOT$' }
  managed_paths:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, installed_sha256, ownership]
      properties:
        path: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
        installed_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        ownership: { const: FRAMEWORK_MANAGED }
        original_backup_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  preserve_unmanaged: { const: true }
  restore_originals: { const: true }
