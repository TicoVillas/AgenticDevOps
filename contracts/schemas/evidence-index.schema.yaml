$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:evidence-index:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, evidence_id, commit_sha, created_at, entries, limitations, sanitized]
properties:
  schema_version: { const: 1 }
  evidence_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
  commit_sha: { type: string, pattern: '^[a-f0-9]{40}$' }
  created_at: { type: string, format: date-time }
  entries:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, result, sha256]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$' }
        kind: { enum: [BUILD, TEST, VALIDATION, HOST, RELEASE, LIMITATION] }
        result: { enum: [PASS, FAIL, BLOCKED, NOT_RUN] }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        uri: { type: string, minLength: 1 }
  limitations:
    type: array
    items: { type: string, minLength: 1 }
  sanitized: { const: true }
