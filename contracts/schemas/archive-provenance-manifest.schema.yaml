$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:archive-provenance-manifest:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, manifest_id, created_at, trust_label, source_sets, files, archives]
properties:
  schema_version: { const: 1 }
  manifest_id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
  created_at: { type: string, format: date-time }
  trust_label: { enum: [VERIFIED_SOURCE, HISTORICAL_UNTRUSTED] }
  source_sets:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, origin, captured_at]
      properties:
        id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        origin: { type: string, minLength: 1 }
        captured_at: { type: string, format: date-time }
        git_bundle: { type: boolean }
        source_kind: { enum: [DIRECTORY, FILE] }
        trust_label: { enum: [VERIFIED_SOURCE, HISTORICAL_UNTRUSTED_EVIDENCE] }
        git:
          type: object
          additionalProperties: false
          required: [head_oid, head_state, refs, head_reachable_from, status_clean, fsck]
          properties:
            head_oid: { type: string, pattern: '^[a-f0-9]{40}$' }
            head_state: { enum: [ATTACHED, DETACHED] }
            refs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [oid, ref]
                properties:
                  oid: { type: string, pattern: '^[a-f0-9]{40}$' }
                  ref: { type: string, pattern: '^refs/.+' }
            head_reachable_from:
              type: array
              minItems: 1
              items: { type: string, pattern: '^refs/.+' }
            status_clean: { const: true }
            fsck: { const: PASS }
  files:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [source_set_id, path, sha256, size]
      properties:
        source_set_id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        path: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 0 }
  archives:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, algorithm, sha256, size]
      properties:
        name: { type: string, pattern: '^(?!/)[^\\]+$' }
        algorithm: { const: sha256 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 0 }
        source_set_id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        kind: { enum: [SNAPSHOT, GIT_BUNDLE, HISTORICAL_OPAQUE] }
        format: { enum: [TAR_GZIP, GIT_BUNDLE, OPAQUE_TGZ] }
        trust_label: { enum: [VERIFIED_SOURCE, HISTORICAL_UNTRUSTED_EVIDENCE] }
        logical_root: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        reproducible: { type: boolean }
        normalization:
          type: object
          additionalProperties: false
          required: [mtime_epoch, owner, group, mode, gzip_name_and_time]
          properties:
            mtime_epoch: { type: integer, minimum: 0 }
            owner: { type: integer, minimum: 0 }
            group: { type: integer, minimum: 0 }
            mode: { type: string, pattern: '^0[0-7]{3}$' }
            gzip_name_and_time: { type: boolean }
