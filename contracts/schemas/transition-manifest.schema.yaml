$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:transition-manifest:3.0
$comment: schema-version-3.0.0
allOf:
  - $ref: urn:agentic-devops:evidence-envelope:3.0
  - type: object
    required: [from_phase, to_phase, from_skill, to_skill, authorization_current, artifact_final, artifact_hashes, selection_ref, hashes_match, guard_results, assurance_satisfied, evidence_sufficient, checkpoint_pending, session, independence_required, pending_decision, authority, actions_not_executed, decision]
    properties:
      from_phase: { type: string, minLength: 1 }
      to_phase: { type: string, minLength: 1 }
      from_skill: { type: [string, 'null'] }
      to_skill: { type: [string, 'null'] }
      authorization_current: { type: boolean }
      artifact_final: { type: boolean }
      artifact_hashes: { type: object, minProperties: 1, additionalProperties: { type: string, pattern: '^[a-f0-9]{64}$' } }
      selection_ref:
        type: object
        additionalProperties: false
        required: [reference, sha256]
        properties:
          reference: { type: string, minLength: 1 }
          sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      operation_binding:
        type: object
        additionalProperties: false
        required: [operation_id, scope_sha256]
        properties:
          operation_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
          scope_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      hashes_match: { type: boolean }
      guard_results: { type: array, minItems: 1, items: { type: object, required: [name, passed], properties: { name: { type: string }, passed: { type: boolean }, evidence: { type: string } } } }
      assurance_satisfied: { type: boolean }
      evidence_sufficient: { type: boolean }
      checkpoint_pending: { type: boolean }
      session:
        type: object
        additionalProperties: false
        required: [line, strategy, current_identity, destination_identity]
        properties:
          line: { type: string }
          strategy: { enum: [SAME_SESSION, ORIGINAL_AUTHOR, NEW_INDEPENDENT, ORIGINAL_REVIEWER, ORIGINAL_EXECUTOR, ORIGINAL_VALIDATOR] }
          current_identity: { type: string }
          destination_identity: { type: string }
      independence_required: { type: boolean }
      pending_decision: { type: boolean }
      authority:
        type: object
        additionalProperties: false
        required: [scope_unchanged, paths_unchanged, permissions_unchanged, git_actions_requested, git_actions_authorized, remote_actions_requested, remote_actions_authorized]
        properties:
          scope_unchanged: { type: boolean }
          paths_unchanged: { type: boolean }
          permissions_unchanged: { type: boolean }
          git_actions_requested: { type: boolean }
          git_actions_authorized: { type: boolean }
          remote_actions_requested: { type: boolean }
          remote_actions_authorized: { type: boolean }
      actions_not_executed: { type: array, items: { type: string } }
      decision: { enum: [CHAINED, CHECKPOINT_REQUIRED, BLOCKED] }
