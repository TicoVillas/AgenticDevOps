$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:ci-evidence-index:3.0
$comment: schema-version-3.1.0; sanitized CI and release evidence without authority
type: object
additionalProperties: false
required: [schema_version, workflow, commit_sha, generated_at, jobs, artifacts, limitations, authorization_granted, sanitized]
properties:
  schema_version: { const: 1 }
  workflow: { enum: [pr, release] }
  commit_sha: { type: string, pattern: '^[a-f0-9]{40}$' }
  generated_at: { type: string, format: date-time }
  jobs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, result, evidence_sha256]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9_-]{1,63}$' }
        result: { enum: [PASS, BLOCKED, SKIPPED] }
        evidence_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  artifacts:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, sha256, size]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, minimum: 0 }
  limitations:
    type: array
    uniqueItems: true
    items: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
  authorization_granted: { const: false }
  sanitized: { const: true }
