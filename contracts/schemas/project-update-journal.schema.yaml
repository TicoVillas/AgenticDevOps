$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:project-update-journal:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, operation_id, plan_sha256, project_snapshot_sha256, status, entries]
properties:
  schema_version: { const: 1 }
  operation_id: { type: string, pattern: '^project-(?!(?:checkpoint|authorization|receipt)-)[A-Za-z0-9._-]{1,120}$' }
  plan_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  project_snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  status: { enum: [PLANNED, APPLYING, VERIFIED, FAILED_KNOWN, PARTIAL_KNOWN, PARTIAL, UNKNOWN] }
  durable_sequence: { type: integer, minimum: 0 }
  fsync_evidence:
    type: object
    additionalProperties: false
    required: [intent_fsynced_through, journal_fsynced]
    properties:
      intent_fsynced_through: { type: integer, minimum: 0 }
      journal_fsynced: { type: boolean }
  reconciliation:
    type: object
    additionalProperties: false
    required: [status, observed_at]
    properties:
      status: { enum: [NOT_REQUIRED, UNRECONCILED, RECONCILED] }
      observed_at: { type: string, format: date-time }
  entries:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [sequence, path, action, state, intent_recorded_at, intent_fsynced]
      properties:
        sequence: { type: integer, minimum: 1 }
        item_id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        path: { type: string, pattern: '^\.agentic/(?!.*(?:^|/)\.\.(?:/|$)).+$' }
        action: { enum: [CREATE, UPDATE, PRESERVE, MERGE] }
        state: { enum: [PLANNED, APPLYING, VERIFIED, FAILED_KNOWN, PARTIAL_KNOWN, PARTIAL, UNKNOWN] }
        intent_recorded_at: { type: string, format: date-time }
        intent_fsynced: { type: boolean }
        before_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        after_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
