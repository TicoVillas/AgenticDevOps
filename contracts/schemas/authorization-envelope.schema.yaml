$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:authorization-envelope:3.0
$comment: schema-version-3.1.0; explicit lifecycle mutation authority only
type: object
additionalProperties: false
required: [schema_version, authorization_id, operation_id, operation_class, issued_at, expires_at, status, provenance, synthetic_only, scope, bindings, operations]
properties:
  schema_version: { const: 1 }
  authorization_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
  operation_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
  operation_class: { enum: [INSTALL, UPDATE, RECONCILE, RESUME, ROLLBACK, UNINSTALL] }
  issued_at: { type: string, format: date-time }
  expires_at: { type: string, format: date-time }
  status: { const: EXPLICITLY_AUTHORIZED }
  provenance: { const: DIRECT_USER_AUTHORIZATION }
  synthetic_only: { const: true }
  scope:
    type: object
    additionalProperties: false
    required: [destination_root_id, destination_root_sha256, state_root_sha256]
    properties:
      destination_root_id: { const: SYNTHETIC_KIRO_ROOT }
      destination_root_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      state_root_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  bindings:
    type: object
    additionalProperties: false
    required: [plan_sha256, snapshot_sha256, source_sha256, manifest_sha256, lock_sha256]
    properties:
      plan_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      source_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      lock_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  operations:
    type: array
    minItems: 1
    uniqueItems: true
    items: { enum: [PLAN, APPLY, RECONCILE_READ_ONLY, RESUME, ROLLBACK, UNINSTALL] }
