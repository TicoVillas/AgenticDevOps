$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:project-update-authorization:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, authorization_id, operation_id, operation_class, checkpoint_id, issued_at, expires_at, status, provenance, synthetic_only, bindings, operations]
properties:
  schema_version: { const: 1 }
  authorization_id: { type: string, pattern: '^project-authorization-[A-Za-z0-9._-]{1,109}$' }
  operation_id: { type: string, pattern: '^project-(?!(?:checkpoint|authorization|receipt)-)[A-Za-z0-9._-]{1,120}$' }
  operation_class: { enum: [PROJECT_UPDATE, PROJECT_ROLLBACK] }
  checkpoint_id: { type: [string, 'null'], pattern: '^project-checkpoint-[A-Za-z0-9._-]{1,112}$' }
  issued_at: { type: string, format: date-time }
  expires_at: { type: string, format: date-time }
  status: { const: EXPLICITLY_AUTHORIZED }
  provenance: { const: DIRECT_USER_AUTHORIZATION }
  synthetic_only: { const: true }
  bindings:
    type: object
    additionalProperties: false
    required: [plan_sha256, snapshot_sha256, project_root_sha256]
    properties:
      plan_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      project_root_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      backup_manifest_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  operations:
    type: array
    minItems: 1
    uniqueItems: true
    items: { enum: [APPLY, ROLLBACK] }
allOf:
  - if: { properties: { operation_class: { const: PROJECT_UPDATE } } }
    then:
      properties:
        checkpoint_id: { type: string }
        operations: { type: array, items: { const: APPLY } }
  - if: { properties: { operation_class: { const: PROJECT_ROLLBACK } } }
    then:
      properties:
        checkpoint_id: { type: 'null' }
        operations: { type: array, items: { const: ROLLBACK } }
      required: [checkpoint_id]
