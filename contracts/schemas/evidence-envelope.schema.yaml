$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:evidence-envelope:3.0
$comment: schema-version-3.0.0
type: object
required: [version, origin, executor_role, phase, authorization, scope, timestamps, hashes, classification, sanitization, results, limitations, references]
properties:
  version: { const: 1 }
  origin: { type: string, minLength: 1 }
  executor_role: { enum: [CONSULTING, ENGINEERING, CONTRACT_ASSURANCE, DELIVERY_ASSURANCE] }
  phase: { type: string, minLength: 1 }
  authorization:
    type: object
    required: [reference, operations]
    properties:
      reference: { type: string, minLength: 1 }
      operations: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
  scope:
    type: object
    required: [resources]
    properties:
      resources: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
  timestamps:
    type: object
    required: [created_at]
    properties:
      created_at: { type: string, format: date-time }
      observed_at: { type: string, format: date-time }
  hashes:
    type: object
    additionalProperties: { type: string, pattern: '^[a-f0-9]{64}$' }
  classification: { enum: [CONFIRMED_DIRECTLY, CONFIRMED_BY_IDENTITY, REPORTED, INFERRED, NOT_EXECUTED, BLOCKED] }
  sanitization:
    type: object
    required: [secrets_removed, personal_data_minimized]
    properties:
      secrets_removed: { const: true }
      personal_data_minimized: { const: true }
  results: { type: array, items: { type: object } }
  limitations: { type: array, items: { type: string } }
  references: { type: array, items: { type: string } }
