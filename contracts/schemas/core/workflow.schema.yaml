$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:workflow:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [version, principles, phases, automatic_transitions, human_transitions, session_rules]
properties:
  version: { const: 3.0.0 }
  principles: { type: object, minProperties: 1 }
  phases:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, role, skill]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]+$' }
        role: { enum: [CONSULTING, ENGINEERING, CONTRACT_ASSURANCE, DELIVERY_ASSURANCE] }
        skill: { type: [string, 'null'] }
  automatic_transitions:
    type: array
    items: { $ref: '#/$defs/automaticTransition' }
  human_transitions:
    type: array
    items: { $ref: '#/$defs/humanTransition' }
  session_rules: { type: object, minProperties: 1 }
$defs:
  automaticTransition:
    type: object
    additionalProperties: false
    required: [from, to, guard]
    properties:
      from: { type: string }
      to: { type: string }
      guard: { type: string, minLength: 1 }
  humanTransition:
    type: object
    additionalProperties: false
    required: [from, to, authorization]
    properties:
      from: { type: string }
      to: { type: string }
      authorization: { type: string, minLength: 1 }
