$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:operation-plan:3.0
$comment: schema-version-3.0.0
type: object
additionalProperties: false
required: [schema_version, operation_id, operation_class, destination_root_id, snapshot_sha256, source_sha256, decision, actions, stop_conditions]
properties:
  schema_version: { const: 1 }
  operation_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
  operation_class: { enum: [INSTALL, UPDATE, ROLLBACK, UNINSTALL, RECONCILE, RESUME, PROJECT_UPDATE] }
  destination_root_id: { type: string, pattern: '^[A-Z][A-Z0-9_]*_ROOT$' }
  snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  source_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  authorization_binding:
    type: object
    additionalProperties: false
    required: [operation_id, scope_sha256]
    properties:
      operation_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$' }
      scope_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  decision: { enum: [NO_CHANGE, CHECKPOINT_REQUIRED, BLOCKED] }
  actions:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [sequence, path, action, before_sha256, after_sha256]
      properties:
        sequence: { type: integer, minimum: 1 }
        path: { type: string, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$)).+$' }
        action: { enum: [CREATE, UPDATE, REMOVE, RESTORE, VERIFY] }
        before_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        after_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
  stop_conditions:
    type: array
    minItems: 1
    uniqueItems: true
    items: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
allOf:
  - if: { properties: { decision: { const: CHECKPOINT_REQUIRED } } }
    then:
      required: [authorization_binding]
      properties:
        authorization_binding: { type: object }
        actions: { type: array, minItems: 1 }
