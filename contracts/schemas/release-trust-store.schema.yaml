$schema: http://json-schema.org/draft-07/schema#
$id: urn:agentic-devops:release-trust-store:3.0
$comment: schema-version-3.1.0; public material only
type: object
additionalProperties: false
required: [schema_version, trust_store_id, version, generated_at, keys, key_events_sha256]
properties:
  schema_version: { const: 1 }
  trust_store_id: { type: string, pattern: '^release-trust-[a-z0-9][a-z0-9-]{2,63}$' }
  version: { type: integer, minimum: 1 }
  generated_at: { type: string, format: date-time }
  key_events_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  keys:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, fingerprint_sha256, public_key_spki_base64, valid_from, status]
      properties:
        key_id: { type: string, pattern: '^release-[a-z0-9][a-z0-9-]{2,63}$' }
        algorithm: { const: Ed25519 }
        fingerprint_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        public_key_spki_base64: { type: string, pattern: '^[A-Za-z0-9+/]+={0,2}$', minLength: 4 }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        status: { enum: [ACTIVE, RETIRED, REVOKED] }
        supersedes: { type: string, pattern: '^release-[a-z0-9][a-z0-9-]{2,63}$' }
        revoked_at: { type: string, format: date-time }
        revocation_reason: { type: string, minLength: 1, maxLength: 512 }
